[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yargen"
version = "0.1.0"
description = "Gerador automatico de charts para YARG / Clone Hero a partir de audio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Dependencias base: so DSP e MIDI. Nenhuma delas puxa PyTorch, que e o maior
# atrito de instalacao do projeto. Stems e letra sao extras opcionais.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mido>=1.3",
]

[project.optional-dependencies]
# Versoes fixadas porque a combinacao torch/torchaudio/demucs e a fonte
# historica de quebra de ambiente neste tipo de projeto.
stems = ["torch>=2.1", "torchaudio>=2.1", "demucs>=4.0"]
vocals = ["faster-whisper>=1.0"]
all = ["torch>=2.1", "torchaudio>=2.1", "demucs>=4.0", "faster-whisper>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
yargen = "yargen.cli:main"

[tool.setuptools.packages.find]
include = ["yargen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
